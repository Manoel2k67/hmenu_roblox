name: Validate HMenu

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Luau 0.734
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "luau-windows.zip"
          $destination = Join-Path $env:RUNNER_TEMP "luau"
          Invoke-WebRequest `
            -Uri "https://github.com/luau-lang/luau/releases/download/0.734/luau-windows.zip" `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force

      - name: Validate source and bundle
        shell: pwsh
        run: |
          $compiler = Join-Path $env:RUNNER_TEMP "luau\luau-compile.exe"
          .\tools\Test-Project.ps1 -LuauCompiler $compiler
